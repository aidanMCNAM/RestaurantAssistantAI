<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #14161a;
      color: #e8e8ea;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid #2a2d33;
      font-weight: 600;
    }
    header span { color: #8a8f98; font-weight: 400; margin-left: 8px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user { align-self: flex-end; background: #3b6cf6; color: white; }
    .bot { align-self: flex-start; background: #23262d; }
    .bot.thinking { color: #8a8f98; font-style: italic; }
    form {
      display: flex;
      gap: 8px;
      padding: 16px 24px;
      border-top: 1px solid #2a2d33;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #2a2d33;
      background: #1c1f25;
      color: inherit;
      font-size: 15px;
    }
    input:focus { outline: none; border-color: #3b6cf6; }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #3b6cf6;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>Restaurant Assistant <span>ask about policies and procedures</span></header>
  <div id="chat">
    <div class="bubble bot">Hi! Ask me anything about our restaurant's policies.</div>
  </div>
  <form id="form">
    <input id="question" placeholder="e.g. What do I do if a guest has a shellfish allergy?" autocomplete="off">
    <button id="send" type="submit">Ask</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("question");
    const sendBtn = document.getElementById("send");

    function addBubble(text, className) {
      const div = document.createElement("div");
      div.className = "bubble " + className;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addBubble(question, "user");
      input.value = "";
      sendBtn.disabled = true;
      const thinking = addBubble("Thinking...", "bot thinking");

      try {
        const response = await fetch("/documents/ask?q=" + encodeURIComponent(question));
        if (!response.ok) throw new Error("Server returned " + response.status);
        thinking.textContent = await response.text();
        thinking.classList.remove("thinking");
      } catch (error) {
        thinking.textContent = "Something went wrong: " + error.message;
      }

      sendBtn.disabled = false;
      input.focus();
    });
  </script>
</body>
</html>
